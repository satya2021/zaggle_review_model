<!DOCTYPE html>
<html>

<head>
    <title>App Review Response Agent</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
        }

        textarea {
            width: 80%;
            height: 100px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #response {
            border: 1px solid #ccc;
            padding: 10px;
            margin-top: 20px;
            width: 80%;
        }

        .review {
            background-color: #f0f0f0;
            padding: 10px;
            margin-bottom: 10px;
        }

        .generated-response {
            background-color: #e0f7fa;
            padding: 10px;
            margin-bottom: 10px;
        }

        .sentiment-positive {
            color: green;
        }

        .sentiment-negative {
            color: red;
        }

        .sentiment-neutral {
            color: grey;
        }

        .loading {
            opacity: 0.5;
        }

        .error {
            color: red;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        #feedback-form {
            display: none;
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
        }

        #feedback-form button {
            margin-right: 10px;
        }

        #agent-input {
            width: 100%;
            height: 80px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
<h1>App Review Response Agent</h1>

<div class="form-group">
    <label for="reviewText">Enter App Review:</label>
    <textarea id="reviewText" placeholder="Enter app review here"></textarea>
</div>

<div class="form-group">
    <label for="rating">Enter Review Rating (Optional):</label>
    <input type="number" id="rating" placeholder="Enter rating (1-5)" min="1" max="5">
</div>

<div class="form-group">
    <label for="persona">Select Persona:</label>
    <select id="persona">
        <option value="helpful_assistant">Helpful Assistant</option>
        <option value="empathetic_support">Empathetic Support</option>
        <option value="feature_promoter">Feature Promoter</option>
    </select>
</div>

<div class="form-group">
    <label for="hallucination">Hallucination Control:</label>
    <select id="hallucination">
        <option value="strict">Strict</option>
        <option value="moderate">Moderate</option>
        <option value="lenient">Lenient</option>
    </select>
</div>

<div class="form-group">
    <label for="empathy">Empathy Level:</label>
    <select id="empathy">
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
    </select>
</div>

<div class="form-group">
    <button id="processButton">Generate Response</button>
</div>

<div id="response"></div>

<div id="feedback-form">
    <h2>Was this response helpful?</h2>
    <textarea id="agent-input" placeholder="Enter your feedback or edit the response"></textarea>
    <button class="feedback-button" data-feedback="helpful">Helpful</button>
    <button class="feedback-button" data-feedback="inaccurate">Inaccurate</button>
    <button class="feedback-button" data-feedback="inappropriate">Inappropriate</button>
    <button class="feedback-button" data-feedback="not_empathetic">Not Empathetic</button>
    <button class="feedback-button" data-feedback="hallucination" data-hallucination="true">Hallucination</button>
    <button class="feedback-button" data-feedback="edit">Submit Edit</button>
</div>

<script>
    $(document).ready(function() {
        var currentReviewText = "";
        var currentGeneratedResponse = "";

        $("#processButton").click(function() {
            var reviewText = $("#reviewText").val();
            var rating = $("#rating").val();
            var persona = $("#persona").val();
            var hallucination = $("#hallucination").val();
            var empathy = $("#empathy").val();

            if (reviewText) {
                $("#response").html("Processing review...");
                $("#processButton").prop("disabled", true).addClass("loading");

                var requestData = {
                    review_data: {
                        text: reviewText,
                        rating: parseInt(rating) || null,
                        persona: persona,
                        hallucination: hallucination,
                        empathy: empathy,
                        request_feedback: true
                    }
                };

                $.ajax({
                    url: "/process_review",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify(requestData),
                    dataType: "json",
                    success: function(data) {
                        var taskId = data.task_id;
                        checkTaskStatus(taskId, reviewText, data.feedback_requested);
                    },
                    error: function(error) {
                        $("#response").html("<div class='error'>Error processing review.</div>");
                        $("#processButton").prop("disabled", false).removeClass("loading");
                    }
                });
            } else {
                alert("Please enter a review.");
            }
        });

        function checkTaskStatus(taskId, reviewText, feedbackRequested) {
            var checkStatusInterval = setInterval(function() {
                $.getJSON("/task_status/" + taskId, function(taskData) {
                    if (taskData.status === "SUCCESS") {
                        clearInterval(checkStatusInterval);
                        displayResponse(taskData.result, reviewText, feedbackRequested);
                    } else if (taskData.status === "FAILURE") {
                        clearInterval(checkStatusInterval);
                        $("#response").html("<div class='error'>Error: " + taskData.error + "</div>");
                        $("#processButton").prop("disabled", false).removeClass("loading");
                    }
                });
            }, 1000);
        }

        function displayResponse(data, reviewText, feedbackRequested) {
            var sentimentClass = "sentiment-" + data.sentiment;
            currentReviewText = reviewText;
            currentGeneratedResponse = data.generated_response;
            $("#response").html(
                "<div class='review'><b>Review:</b> " + reviewText + "</div>" +
                "<div class='generated-response'><b>Sentiment:</b> <span class='" + sentimentClass + "'>" + data.sentiment + "</span><br><br><b>Response:</b> " + data.generated_response + "</div>"
            );
            $("#processButton").prop("disabled", false).removeClass("loading");
            if (feedbackRequested) {
                $("#feedback-form").show();
            }
        }

        $(".feedback-button").click(function() {
            var feedback = $(this).data("feedback");
            var hallucination = $(this).data("hallucination") || false;
            var empathy_score = 0; // Replace with actual empathy score calculation
            var agent_input = $("#agent-input").val();

            $.ajax({
                url: "/feedback",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({
                    review_text: currentReviewText,
                    generated_response: currentGeneratedResponse,
                    feedback: feedback,
                    hallucination_detected: hallucination,
                    empathy_score: empathy_score,
                    agent_input: agent_input
                }),
                dataType: "json",
                success: function(data) {
                    if (data.status === "success") {
                        alert("Feedback submitted. Thank you!");
                        $("#feedback-form").hide();
                    } else {
                        alert("Error submitting feedback.");
                    }
                },
                error: function(error) {
                    alert("Error submitting feedback.");
                }
            });
        });
    });
</script>
</body>

</html>
